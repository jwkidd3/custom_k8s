# ─── External Secrets Operator ──────────────────────────────────────────────
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: external-secrets
  install:
    createNamespace: true
  chart:
    spec:
      chart: external-secrets
      sourceRef:
        kind: HelmRepository
        name: external-secrets
      # ClusterSecretStore in security-stores uses external-secrets.io/v1,
      # which requires ESO >= 0.17
      version: ">=0.17.0"
  values:
    serviceAccount:
      name: external-secrets
---
# ─── Kyverno ───────────────────────────────────────────────────────────────
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: kyverno
  install:
    createNamespace: true
  chart:
    spec:
      chart: kyverno
      sourceRef:
        kind: HelmRepository
        name: kyverno
      # Pin below chart 3.10.0 (app v1.20.0), which removed execution of
      # legacy kyverno.io/v1 ClusterPolicy types this course still ships.
      # 3.9.2 == app v1.19.2, the last release that accepts them.
      version: ">=3.2.0,<3.10.0"
  values:
    replicaCount: 3
---
# ─── Kyverno Baseline Policies ─────────────────────────────────────────────
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno-policies
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: kyverno
  dependsOn:
    - name: kyverno
  chart:
    spec:
      chart: kyverno-policies
      sourceRef:
        kind: HelmRepository
        name: kyverno
      # Keep in lockstep with the kyverno chart pin above (< 3.10.0 / app v1.20).
      version: ">=3.2.0,<3.10.0"
  values:
    podSecurityStandard: baseline
    validationFailureAction: Audit
